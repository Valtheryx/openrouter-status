name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile app/app.py
      - name: Start container stack
        run: |
          mkdir -p data
          OPENROUTER_API_KEY=dummy docker compose up -d
          sleep 5
          curl -fsS http://localhost:8097/api/health
      - name: Logs
        if: failure()
        run: docker compose logs
