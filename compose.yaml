services:
  openrouter-status:
    image: python:3.12-slim
    container_name: openrouter-status
    restart: unless-stopped
    command: ["python", "/app/app.py"]
    ports:
      - "8097:8000"
    volumes:
      - ./app:/app:ro
      - ./data:/data
    environment:
      - TZ=Europe/Berlin
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REFRESH_MINUTES=${REFRESH_MINUTES:-60}
      - RETENTION_DAYS=${RETENTION_DAYS:-93}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
